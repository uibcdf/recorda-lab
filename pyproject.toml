[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recorda-lab"
version = "0.0.0"
description = "Independent dummy operations and controlled Recorda experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["MOLI_GUIDE.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
