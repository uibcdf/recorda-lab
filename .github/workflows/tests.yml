name: Dummy tests and manual Recorda integration

on:
  push:
  pull_request:
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:
    inputs:
      recorda_commit:
        description: Reviewed full commit SHA of the published Recorda implementation
        required: true
        default: 48a6c9a0630027f0f2c3d8d82215de8e27764913
        type: string
      run_scipy:
        description: Also run the controlled SciPy trial and scientific notebook
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dummy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel pytest pytest-receptor==1.1.0 ruff==0.16.5
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python devtools/validate_governance.py
      - run: ruff check .
      - run: ruff format --check .
      - name: Check out the reviewed MOLI governance core
        uses: actions/checkout@v4
        with:
          repository: uibcdf/moli
          ref: 4316867722f259fdf77f4d7d5e6e2c093ff95d04
          path: .moli-governance
      - name: Check shared MOLI governance core
        run: >-
          python .moli-governance/devtools/scripts/check_repository.py .
          --canonical-guide .moli-governance/MOLI_GUIDE.md
      - run: python -m pytest --receptor=ci -o pythonpath='' tests/test_dummy.py
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Validate source identity
        env:
          RECORDA_COMMIT: ${{ inputs.recorda_commit }}
        run: python -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["RECORDA_COMMIT"]), "full reviewed SHA required"'
      - uses: actions/checkout@v4
        with:
          repository: uibcdf/recorda
          ref: ${{ inputs.recorda_commit }}
          path: recorda
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: lab/devtools/conda-envs/notebook_env.yaml
          create-args: python=${{ matrix.python }} --strict-channel-priority
      - run: python -m pip install pytest-receptor==1.1.0
      - run: python recorda/devtools/check_dependencies.py
      - run: python recorda/devtools/verify_support_environment.py argdigest
      - name: Verify the selected Recorda source and laboratory environments
        env:
          RECORDA_COMMIT: ${{ inputs.recorda_commit }}
        run: python lab/devtools/check_recorda_environment.py --recorda recorda --commit "$RECORDA_COMMIT"
      - run: python -m pip install --no-deps --no-build-isolation ./recorda ./lab
      - run: python -m pip check
      - run: python -m pytest --receptor=ci -o pythonpath='' lab/tests
        env:
          RECORDA_LAB_NOTEBOOK: '1'
  scientific:
    if: github.event_name == 'workflow_dispatch' && inputs.run_scipy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Validate source identity
        env:
          RECORDA_COMMIT: ${{ inputs.recorda_commit }}
        run: python -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["RECORDA_COMMIT"]), "full reviewed SHA required"'
      - uses: actions/checkout@v4
        with:
          repository: uibcdf/recorda
          ref: ${{ inputs.recorda_commit }}
          path: recorda
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: lab/devtools/conda-envs/scientific_env.yaml
          create-args: --strict-channel-priority
      - run: python -m pip install pytest-receptor==1.1.0
      - run: python recorda/devtools/check_dependencies.py
      - run: python recorda/devtools/verify_support_environment.py argdigest
      - name: Verify the selected Recorda source and laboratory environments
        env:
          RECORDA_COMMIT: ${{ inputs.recorda_commit }}
        run: python lab/devtools/check_recorda_environment.py --recorda recorda --commit "$RECORDA_COMMIT"
      - run: python -m pip install --no-deps --no-build-isolation ./recorda ./lab
      - run: python -m pip check
      - run: python -m pytest --receptor=ci -o pythonpath='' tests ../lab/tests
        working-directory: recorda
        env:
          RECORDA_LAB_NOTEBOOK: '1'
          RECORDA_LAB_SCIPY: '1'
          RECORDA_TEST_SMONITOR: '1'
